<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Caledvwlch — a strawberry-milk daydream</title>
  <desc id="desc">A pastel pink dessert meadow with original fan-art drawings of Chiikawa, Hachiware and Usagi, floating clouds, strawberries and softly twinkling stars. Caledvwlch: cybersecurity study room.</desc>
  <defs>
    <linearGradient id="milk" x2="0" y2="1"><stop stop-color="#fff8fa"/><stop offset="1" stop-color="#fff1f6"/></linearGradient>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#f8e5ef"/><stop offset=".68" stop-color="#fff1f6"/><stop offset="1" stop-color="#fff4cf"/></linearGradient>
    <linearGradient id="icing" x2="0" y2="1"><stop stop-color="#fffafd"/><stop offset="1" stop-color="#ffd7e6"/></linearGradient>
    <pattern id="gingham" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fff1f6"/><path d="M0 6H24M6 0V24" stroke="#f6a9c6" stroke-width="12" opacity=".13"/></pattern>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1" fill="#de9cb6" opacity=".28"/></pattern>
    <clipPath id="window"><rect x="28" y="28" width="944" height="304" rx="27"/></clipPath>
    <g id="star"><path d="M0-9Q1-1 8 0Q1 1 0 9Q-1 1-8 0Q-1-1 0-9Z" fill="#fff4cf" stroke="#d7a27e" stroke-width="1.3"/></g>
    <g id="cloud" fill="#fffdfb" stroke="#f0cbda" stroke-width="1.5"><path d="M-34 12C-49 11-47-9-32-10C-29-28-7-30 1-15C14-26 32-18 32-4C49-6 52 15 35 17H-31Z"/></g>
    <g id="berry" stroke="#b66d7e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-13-6C-21 3-9 22 0 25C8 23 23 3 14-6C7-12-6-11-13-6Z" fill="#f6a9c6"/><path d="M-1-7L-12-11L-8-3L0-6L8-2L13-11L2-8L1-15" fill="#bfd8ac" stroke="#95b48b"/><path d="M-8 2L-7 4M5 1L4 3M-1 9V11M10 8L9 10M-5 15L-4 17" stroke="#fff4cf" stroke-width="2"/></g>
    <g id="flower"><path d="M0 0V13M0 10Q-8 4-8 9Q-5 13 0 12" fill="none" stroke="#b8cda1" stroke-width="2"/><g fill="#fffdf9" stroke="#ecc4d3" stroke-width=".8"><ellipse cy="-4" rx="3" ry="5"/><ellipse cx="4" rx="5" ry="3"/><ellipse cy="4" rx="3" ry="5"/><ellipse cx="-4" rx="5" ry="3"/></g><circle r="2.5" fill="#f4d98c"/></g>
    <g id="sparkle" fill="#d6a3b5"><circle r="2"/><circle cx="8" cy="-5" r="1"/></g>
  </defs>
  <style>
    .ink{stroke:#866474;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
    .detail{fill:none;stroke:#866474;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
    .twinkle{animation:twinkle 4.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .late{animation-delay:-2.3s}.later{animation-delay:-1.2s}
    .bob{animation:bob 5.6s ease-in-out infinite}.bob2{animation:bob 6.2s ease-in-out -2s infinite}.bob3{animation:bob 5.2s ease-in-out -3s infinite}
    .blink{animation:blink 7s linear infinite;transform-box:fill-box;transform-origin:center}
    .blink2{animation-delay:-2.7s}.blink3{animation-delay:-4.4s}
    @keyframes twinkle{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:1;transform:scale(1.12)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes blink{0%,43%,46%,100%{transform:scaleY(1)}44%,45%{transform:scaleY(.12)}}
    @media(prefers-reduced-motion:reduce){.twinkle,.bob,.bob2,.bob3,.blink{animation:none}}
  </style>
  <!-- A stitched gingham frame: all artwork is local, with a complete static first frame. -->
