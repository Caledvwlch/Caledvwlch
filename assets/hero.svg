    <path d="M84 75Q87 70 90 75Q93 70 96 75Q98 79 90 83Q82 79 84 75Z" fill="#e6a0bc"/>
    <text x="105" y="81.5" fill="#ad7b91" font-family="Verdana, sans-serif" font-size="9.2" letter-spacing="1.7">SWEET LITTLE CORNER</text>
    <text x="69" y="151" fill="#fffdfb" stroke="#fffdfb" stroke-width="7" stroke-linejoin="round" font-family="Georgia, 'Times New Roman', serif" font-size="61" font-weight="700" letter-spacing="-1.7">Caledvwlch</text>
    <text x="69" y="151" fill="#a46d87" font-family="Georgia, 'Times New Roman', serif" font-size="61" font-weight="700" letter-spacing="-1.7">Caledvwlch</text>
