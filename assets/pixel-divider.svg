    <g id="d-star"><path fill="#d9ba7c" d="M4 0h3v4h4v3H7v4H4V7H0V4h4Z"/><path fill="#ffe9ab" d="M4 2h3v3h2v1H6v3H5V6H2V5h2Z"/><path fill="#fff9ec" d="M4 4h2v2H4Z"/></g>
