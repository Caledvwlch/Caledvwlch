<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="48" viewBox="0 0 1000 48" role="img" aria-labelledby="d-title d-desc" shape-rendering="crispEdges">
  <title id="d-title">Strawberry milk pixel ribbon</title>
  <desc id="d-desc">A cream and pink pixel ribbon with softly bobbing strawberry milk, cherries, hearts and blue and butter-yellow stars.</desc>
  <style>
    .bob { animation: bob 6s steps(6, end) infinite; }
    .late { animation-delay: -3s; }
    .twinkle { animation: twinkle 5s ease-in-out infinite; }
    .slow { animation-duration: 7s; animation-delay: -2s; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes twinkle { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .bob,.twinkle { animation: none; } }
  </style>
  <defs>
