<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="126" viewBox="0 -8 1000 126" role="img" aria-labelledby="f-title f-desc" shape-rendering="crispEdges">
  <title id="f-title">A little strawberry milk picnic</title>
  <desc id="f-desc">An original cream pixel bunny with rosy cheeks and blue eyes sits at a pink picnic, surrounded by strawberry milk, cherries, hearts, clouds and gently twinkling stars.</desc>
  <style>
    .bunny-hop {
      transform-box: fill-box;
      transform-origin: 50% 92%;
      animation: f-bunny-hop 2.4s ease-in-out infinite;
    }
    .mat-shadow, .charm-wiggle, .charm-wiggle-late, .heart-pulse, .heart-pulse-late, .twinkle, .twinkle-slow, .cloud-drift, .cloud-drift-alt {
      transform-box: fill-box;
      transform-origin: center;
    }
    .mat-shadow { animation: f-mat-shadow 2.4s ease-in-out infinite; }
    .charm-wiggle { animation: f-charm 2.5s ease-in-out -0.4s infinite; }
    .charm-wiggle-late { animation: f-charm 2.7s ease-in-out -1.6s infinite; }
    .heart-pulse { animation: f-heart-pulse 2.0s ease-in-out -0.2s infinite; }
    .heart-pulse-late { animation: f-heart-pulse 2.2s ease-in-out -1.3s infinite; }
    .twinkle { animation: f-twinkle 2.1s ease-in-out infinite; }
    .twinkle-slow { animation: f-twinkle 2.5s ease-in-out -1.2s infinite; }
    .cloud-drift { animation: f-cloud 5.6s ease-in-out infinite; }
    .cloud-drift-alt { animation: f-cloud 6.4s ease-in-out -2.8s infinite; }
    @keyframes f-bunny-hop {
      0%, 100% { transform: translateY(0) scale(1, 1) rotate(0deg); }
      14% { transform: translateY(1.2px) scale(1.08, 0.90) rotate(0deg); }
      34% { transform: translateY(-3.6px) scale(0.94, 1.07) rotate(-4deg); }
      52% { transform: translateY(0.9px) scale(1.07, 0.92) rotate(0deg); }
      72% { transform: translateY(-3.2px) scale(0.95, 1.06) rotate(4deg); }
      88% { transform: translateY(0.5px) scale(1.03, 0.96) rotate(0deg); }
    }
    @keyframes f-mat-shadow {
      0%, 100% { transform: scaleX(1); opacity: 1; }
      14%, 52% { transform: scaleX(1.05); opacity: 1; }
      34%, 72% { transform: scaleX(0.86); opacity: 0.78; }
    }
    @keyframes f-charm {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1, 1); }
      20% { transform: translateY(0.8px) rotate(-2deg) scale(1.05, 0.94); }
      45% { transform: translateY(-3.5px) rotate(-7deg) scale(1.06, 1.05); }
      65% { transform: translateY(-0.5px) rotate(1deg) scale(1.02, 0.97); }
      85% { transform: translateY(-3px) rotate(7deg) scale(1.06, 1.04); }
    }
    @keyframes f-heart-pulse {
      0%, 100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
      24% { transform: translateY(-4px) scale(1.30) rotate(-6deg); opacity: 1; }
      44% { transform: translateY(-1.5px) scale(1.06) rotate(0deg); opacity: 0.88; }
      64% { transform: translateY(-3.5px) scale(1.25) rotate(6deg); opacity: 1; }
      84% { transform: translateY(0.5px) scale(0.92) rotate(0deg); opacity: 0.78; }
    }
    @keyframes f-twinkle {
      0%, 100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
      35% { opacity: 0.32; transform: translateY(1px) scale(0.65) rotate(-16deg); }
      70% { opacity: 1; transform: translateY(-2.5px) scale(1.30) rotate(16deg); }
    }
    @keyframes f-cloud {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(4px, -2px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bunny-hop, .mat-shadow, .charm-wiggle, .charm-wiggle-late, .heart-pulse, .heart-pulse-late, .twinkle, .twinkle-slow, .cloud-drift, .cloud-drift-alt {
        animation: none;
        transform: none;
        opacity: 1;
      }
    }
  </style>
