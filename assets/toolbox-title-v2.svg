<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="50" viewBox="0 0 1000 50" role="img" aria-labelledby="tb-title tb-desc">
  <title id="tb-title">toolbox</title>
  <desc id="tb-desc">A pastel strawberry-milk sticker banner reading toolbox, garnished with tiny pink ribbon bows, hearts, strawberries, and twinkling stars.</desc>
  <style>
    .pixel { shape-rendering: crispEdges; }
    .bob { animation: bob 5.6s steps(4, end) infinite; }
    .bob-late { animation: bob 5.6s steps(4, end) -2.8s infinite; }
    .twinkle { animation: twinkle 4.2s ease-in-out infinite; }
    .twinkle-late { animation: twinkle 4.8s ease-in-out -2.1s infinite; }
    .title-text {
      font-family: ui-rounded, -apple-system, BlinkMacSystemFont, Comfortaa, Nunito, Helvetica, Arial, sans-serif;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 3.5px;
      fill: #5d3442;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.62; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bob, .bob-late, .twinkle, .twinkle-late { animation: none; }
    }
  </style>
  <defs>
    <!-- Pixel Heart (14x12) -->
    <g id="px-heart" class="pixel">
      <path fill="#784754" d="M2 0h4v1h2V0h4v1h2v5h-2v2h-2v2H8v2H6v-2H4V8H2V6H0V1h2Z"/>
      <path fill="#f598b4" d="M2 1h4v1h2V1h4v4h-2v2H8v2H6V7H4V5H2V1Z"/>
      <path fill="#ffd6e3" d="M2 2h3v2H2Z"/>
    </g>
    <!-- Mini Heart (10x9) -->
    <g id="px-mini-heart" class="pixel">
      <path fill="#a8546e" d="M1 0h3v1h2V0h3v1h1v4H9v1H7v1H6v1H4V7H3V6H1V5H0V1h1Z"/>
      <path fill="#f8b0c6" d="M1 1h3v1h2V1h3v3H7v2H5v1H4V6H3V4H1V1Z"/>
      <path fill="#fff5f8" d="M2 2h1v1H2Z"/>
    </g>
    <!-- Plump Kawaii Bow (26x16) -->
    <g id="px-bow" class="pixel">
      <path fill="#784754" d="M2 1h8v2h2v1h2V3h2V1h8v2h2v7h-2v2h-4v3h-4v-2h-1v-1h-2v1H10v2H6v-3H2v-2H0V3h2Z"/>
      <path fill="#f497b2" d="M3 2h7v2h1v5H3V8H2V3h1Zm13 0h7v1h1v5h-1v1h-7V4h1V2Z"/>
      <path fill="#ffd8e4" d="M3 3h5v2H3Zm14 0h5v2h-5Z"/>
      <path fill="#d97190" d="M8 5h2v2H8Zm8 0h2v2h-2Zm-9 6h3v3H7Zm9 0h3v3h-3Z"/>
      <path fill="#e37998" d="M11 3h4v6h-4Z"/>
      <path fill="#ffc2d4" d="M12 4h2v3h-2Z"/>
    </g>
    <!-- Tiny Strawberry (12x14) -->
    <g id="px-berry" class="pixel">
      <path fill="#6d8f58" d="M4 0h4v1h3v2H9v1H3V3H1V1h3Z"/>
      <path fill="#9ec484" d="M4 1h4v2H4Z"/>
      <path fill="#784754" d="M2 3h8v2h2v4h-2v2H8v2H4v-2H2V9H0V5h2Z"/>
      <path fill="#f27d9c" d="M2 4h8v1h1v3H9v2H7v2H5v-2H3V8H1V5h1Z"/>
      <path fill="#ffd9e5" d="M3 5h2v2H3Zm4 1h1v1H7Zm-2 3h1v1H5Z"/>
    </g>
    <!-- Gold Sparkle Star (11x11) -->
    <g id="px-star-gold" class="pixel">
      <path fill="#c99742" d="M4 0h3v4h4v3H7v4H4V7H0V4h4Z"/>
      <path fill="#ffe694" d="M4 2h3v2h2v3H7v2H4V7H2V4h2Z"/>
      <path fill="#fffdf4" d="M4 4h3v3H4Z"/>
    </g>
    <!-- Blue Sparkle Star (11x11) -->
    <g id="px-star-blue" class="pixel">
      <path fill="#6e9bc2" d="M4 0h3v4h4v3H7v4H4V7H0V4h4Z"/>
      <path fill="#c7e4fc" d="M4 2h3v2h2v3H7v2H4V7H2V4h2Z"/>
      <path fill="#ffffff" d="M4 4h3v3H4Z"/>
    </g>
  </defs>

  <!-- Left & Right Soft Gingham Lace Ribbon Rails -->
  <g class="pixel">
    <!-- Left ribbon bar -->
    <rect x="28" y="21" width="322" height="8" fill="#ffe6ef"/>
    <rect x="28" y="20" width="322" height="2" fill="#e5a6bc"/>
    <rect x="28" y="28" width="322" height="2" fill="#e5a6bc"/>
    <rect x="28" y="23" width="322" height="3" fill="#fff9fb"/>
    <!-- Right ribbon bar -->
    <rect x="650" y="21" width="322" height="8" fill="#ffe6ef"/>
    <rect x="650" y="20" width="322" height="2" fill="#e5a6bc"/>
    <rect x="650" y="28" width="322" height="2" fill="#e5a6bc"/>
    <rect x="650" y="23" width="322" height="3" fill="#fff9fb"/>

    <!-- Stitched pastel beads along rails -->
    <rect x="46" y="23" width="6" height="3" fill="#f39cb6"/>
    <rect x="118" y="23" width="6" height="3" fill="#95c2e8"/>
    <rect x="190" y="23" width="6" height="3" fill="#f5cc7a"/>
    <rect x="262" y="23" width="6" height="3" fill="#f39cb6"/>
    <rect x="330" y="23" width="6" height="3" fill="#95c2e8"/>

    <rect x="664" y="23" width="6" height="3" fill="#95c2e8"/>
    <rect x="732" y="23" width="6" height="3" fill="#f39cb6"/>
    <rect x="804" y="23" width="6" height="3" fill="#f5cc7a"/>
    <rect x="876" y="23" width="6" height="3" fill="#95c2e8"/>
    <rect x="948" y="23" width="6" height="3" fill="#f39cb6"/>
  </g>

  <!-- Flanking Garnishes (Bows, Hearts, Berries, Stars) -->
  <g transform="translate(72 17)"><g class="bob"><use href="#px-bow"/></g></g>
  <g transform="translate(148 19)"><g class="twinkle"><use href="#px-star-gold"/></g></g>
  <g transform="translate(216 18)"><g class="bob-late"><use href="#px-berry"/></g></g>
  <g transform="translate(286 19)"><g class="twinkle-late"><use href="#px-star-blue"/></g></g>

  <g transform="translate(703 19)"><g class="twinkle"><use href="#px-star-blue"/></g></g>
  <g transform="translate(772 18)"><g class="bob"><use href="#px-berry"/></g></g>
  <g transform="translate(841 19)"><g class="twinkle-late"><use href="#px-star-gold"/></g></g>
  <g transform="translate(902 17)"><g class="bob-late"><use href="#px-bow"/></g></g>

  <!-- Center Sticker Plaque Shadow & Die-cut Frame -->
  <g class="pixel">
    <!-- Soft shadow -->
    <path fill="#ecd0dc" d="M358 10h288v4h4v28h-4v4H358v-4h-4V14h4Z"/>
    <!-- Outer cocoa-berry border -->
    <path fill="#784754" d="M356 6h288v4h4v30h-4v4H356v-4h-4V10h4Z"/>
    <!-- Die-cut white-cream rim -->
    <path fill="#fffaf6" d="M358 8h284v3h3v28h-3v3H358v-3h-3V11h3Z"/>
    <!-- Inner strawberry cream fill -->
    <path fill="#fff2f7" d="M361 11h278v2h2v24h-2v2H361v-2h-2V13h2Z"/>
    <!-- Top gingham highlight band -->
    <path fill="#ffe0eb" d="M361 11h278v7H361Z"/>
    <path fill="#ffcede" d="M368 11h8v7h-8Zm16 0h8v7h-8Zm16 0h8v7h-8Zm16 0h8v7h-8Zm16 0h8v7h-8Zm16 0h8v7h-8Zm16 0h8v7h-8Zm16 0h8v7h-8Zm16 0h8v7h-8Zm16 0h8v7h-8Zm16 0h8v7h-8Zm16 0h8v7h-8Zm16 0h8v7h-8Zm16 0h8v7h-8Zm16 0h8v7h-8Zm16 0h8v7h-8Zm16 0h8v7h-8Z" opacity="0.6"/>
    <!-- Inner stitched line -->
    <rect x="366" y="14" width="268" height="22" rx="4" fill="none" stroke="#e49eb6" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <!-- Plaque Bow & Heart Garnishes -->
  <g transform="translate(373 17)"><g class="bob"><use href="#px-bow"/></g></g>
  <g transform="translate(405 21)"><g class="twinkle"><use href="#px-mini-heart"/></g></g>
  <g transform="translate(585 21)"><g class="twinkle-late"><use href="#px-mini-heart"/></g></g>
  <g transform="translate(601 17)"><g class="bob-late"><use href="#px-bow"/></g></g>

  <!-- Soft Pastel Highlighter Bar + Cute Cheek Blush Stripes Around Title -->
  <rect x="444" y="25" width="112" height="8" rx="4" fill="#ffd9e6"/>
  <g stroke="#f293b0" stroke-width="1.8" stroke-linecap="round">
    <line x1="425" y1="29" x2="428" y2="24"/>
    <line x1="430" y1="29" x2="433" y2="24"/>
    <line x1="567" y1="29" x2="570" y2="24"/>
    <line x1="572" y1="29" x2="575" y2="24"/>
  </g>

  <!-- Title Text -->
  <text x="502" y="31" text-anchor="middle" class="title-text">toolbox</text>
</svg>
